{% extends "books/layout.html" %}

{% block title %}Update Book{% endblock %}

{% block body %}
    <div class="box form-box">
        <h2>Update "{{ book.title }}"</h2>

        <form action="{% url 'books:update' book.id %}" method="post" class="book-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" class="btn btn-main" value="Save Changes">
            <a class="btn btn-link back-link" href="{% url 'books:book' book.id %}">Cancel</a>
        </form>
    </div>
{% endblock %}
