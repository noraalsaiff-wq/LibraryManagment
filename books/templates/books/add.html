{% extends "books/layout.html" %}

{% block title %}Add Book{% endblock %}

{% block body %}
    <div class="box form-box">
        <h2>Add a New Book</h2>

        {% if message %}
            <div class="alert alert-success">{{ message }}</div>
        {% endif %}

        <form action="{% url 'books:add' %}" method="post" class="book-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" class="btn btn-main" value="Add Book">
        </form>
    </div>
{% endblock %}
