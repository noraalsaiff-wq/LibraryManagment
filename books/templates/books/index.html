{% extends "books/layout.html" %}

{% block title %}All Books{% endblock %}

{% block body %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Books</h2>
        <a class="btn btn-main" href="{% url 'books:add' %}">Add Book</a>
    </div>

    <div class="box">
        <table class="table book-table mb-0">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                    <tr>
                        <td><a href="{% url 'books:book' book.id %}">{{ book.title }}</a></td>
                        <td>{{ book.author }}</td>
                        <td><span class="genre">{{ book.genre }}</span></td>
                        <td>{{ book.year }}</td>
                        <td class="text-end"><a class="btn btn-sm btn-outline-main" href="{% url 'books:book' book.id %}">View</a></td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="5" class="text-center small-text">No books yet.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
