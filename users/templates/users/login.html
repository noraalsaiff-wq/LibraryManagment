{% extends "books/layout.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block body %}
    <div class="box form-box small-box text-center">
        <img src="{% static 'books/logo.png' %}" alt="Library logo" class="login-logo">
        <h2>Library Login</h2>

        {% if message %}
            <div class="alert alert-warning">{{ message }}</div>
        {% endif %}

        <form action="{% url 'users:login' %}" method="post" class="book-form text-start">
            {% csrf_token %}
            <p>
                <label>Username</label>
                <input type="text" name="username" placeholder="Username" required autofocus>
            </p>
            <p>
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </p>
            <input type="submit" class="btn btn-main w-100" value="Login">
        </form>

        <p class="mt-3 small-text">Don't have an account? <a href="{% url 'users:register' %}">Register here</a></p>
    </div>
{% endblock %}
