{% extends "books/layout.html" %}

{% block title %}Register{% endblock %}

{% block body %}
    <div class="box form-box small-box">
        <h2>Create Account</h2>

        {% if message %}
            <div class="alert alert-warning">{{ message }}</div>
        {% endif %}

        <form action="{% url 'users:register' %}" method="post" class="book-form">
            {% csrf_token %}
            <p>
                <label>Username</label>
                <input type="text" name="username" required>
            </p>
            <p>
                <label>First Name</label>
                <input type="text" name="first_name" required>
            </p>
            <p>
                <label>Last Name</label>
                <input type="text" name="last_name" required>
            </p>
            <p>
                <label>Email</label>
                <input type="email" name="email" required>
            </p>
            <p>
                <label>Password</label>
                <input type="password" name="password" required>
            </p>
            <p>
                <label>Confirm Password</label>
                <input type="password" name="confirmation" required>
            </p>
            <input type="submit" class="btn btn-main w-100" value="Register">
        </form>

        <p class="mt-3 small-text text-center">Already have an account? <a href="{% url 'users:login' %}">Login</a></p>
    </div>
{% endblock %}
